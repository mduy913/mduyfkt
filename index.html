<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Pháp Trận Huyền Ảo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            background-image: radial-gradient(circle at center, #0a0a1a 0%, #000 100%);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="magicCanvas"></canvas>

    <script>
        const canvas = document.getElementById('magicCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let centerX, centerY;
        let time = 0; // Biến thời gian để tạo hiệu ứng mượt mà

        // Cấu hình Ma Pháp Trận
        const CONFIG = {
            numRings: 5,           // Số lượng vòng tròn
            particlesPerRing: 150, // Số hạt trên mỗi vòng
            baseRadius: 60,        // Bán kính vòng trong cùng
            radiusStep: 50,        // Khoảng cách giữa các vòng
            rotationSpeed: 0.005,  // Tốc độ xoay
            breathSpeed: 0.02,     // Tốc độ co giãn (thở)
            breathAmt: 10,         // Độ co giãn
            colors: [
                { r: 100, g: 200, b: 255 }, // Xanh lam
                { r: 255, g: 255, b: 255 }, // Trắng
                { r: 200, g: 100, b: 255 }, // Tím
                { r: 100, g: 255, b: 200 }  // Xanh ngọc
            ]
        };

        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            initParticles();
        }

        class Particle {
            constructor(radius, angle, ringIndex) {
                this.baseRadius = radius;
                this.angle = angle;
                this.ringIndex = ringIndex;
                
                // Mỗi vòng xoay một hướng và tốc độ khác nhau
                this.speed = (ringIndex % 2 === 0 ? 1 : -1) * (CONFIG.rotationSpeed + ringIndex * 0.001);
                
                // Kích thước hạt
                this.size = Math.random() * 2 + 1;
                
                // Màu sắc ngẫu nhiên
                this.color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
                
                // Độ sáng nhấp nháy
                this.alpha = Math.random() * 0.5 + 0.3;
                this.alphaSpeed = Math.random() * 0.05 + 0.02;
                
                // Độ lệch ngẫu nhiên để trông tự nhiên hơn (không thẳng tắp)
                this.offset = (Math.random() - 0.5) * 5;
                
                // Hình dạng: 0 = tròn, 1 = thoi (sao), 2 = vuông nhỏ
                this.shape = Math.random() > 0.85 ? 1 : (Math.random() > 0.9 ? 2 : 0);
            }

            update() {
                // Xoay
                this.angle += this.speed;
                
                // Nhấp nháy độ sáng
                this.alpha += this.alphaSpeed;
                if (this.alpha > 1 || this.alpha < 0.2) {
                    this.alphaSpeed *= -1;
                }
            }

            draw() {
                // Tính toán bán kính có hiệu ứng "thở" (co giãn)
                const breath = Math.sin(time * CONFIG.breathSpeed + this.ringIndex) * CONFIG.breathAmt;
                const currentRadius = this.baseRadius + breath + this.offset;
                
                // Tính tọa độ
                const x = centerX + Math.cos(this.angle) * currentRadius;
                const y = centerY + Math.sin(this.angle) * currentRadius;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(this.angle); // Xoay hạt theo quỹ đạo

                ctx.beginPath();
                ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha})`;
                
                // Vẽ quầng sáng (Glow)
                ctx.shadowBlur = 10;
                ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha})`;

                if (this.shape === 0) {
                    // Hình tròn
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                } else if (this.shape === 1) {
                    // Hình thoi (ngôi sao 4 cánh)
                    ctx.moveTo(0, -this.size * 2);
                    ctx.lineTo(this.size, 0);
                    ctx.lineTo(0, this.size * 2);
                    ctx.lineTo(-this.size, 0);
                    ctx.closePath();
                } else {
                    // Hình vuông nhỏ
                    ctx.rect(-this.size/2, -this.size/2, this.size, this.size);
                }
                
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            
            for (let r = 0; r < CONFIG.numRings; r++) {
                const radius = CONFIG.baseRadius + r * CONFIG.radiusStep;
                const count = CONFIG.particlesPerRing + r * 20; // Vòng ngoài nhiều hạt hơn
                
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    // Thêm chút ngẫu nhiên vào góc để không bị thẳng quá
                    const randomAngle = angle + (Math.random() - 0.5) * 0.1;
                    particles.push(new Particle(radius, randomAngle, r));
                }
            }
        }

        function animate() {
            // Xóa màn hình với hiệu ứng vệt mờ (Trail)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            time += 0.1;

            // Vẽ các hạt
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Vẽ thêm các vòng tròn mờ (nền) để tạo cảm giác trận pháp có cấu trúc
            drawBackgroundRings();

            requestAnimationFrame(animate);
        }

        function drawBackgroundRings() {
            ctx.save();
            ctx.translate(centerX, centerY);
            
            for (let r = 0; r < CONFIG.numRings; r++) {
                const breath = Math.sin(time * CONFIG.breathSpeed + r) * CONFIG.breathAmt;
                const radius = CONFIG.baseRadius + r * CONFIG.radiusStep + breath;
                
                ctx.beginPath();
                // Vẽ vòng tròn mờ
                ctx.strokeStyle = `rgba(100, 200, 255, 0.05)`;
                ctx.lineWidth = 1;
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.stroke();

                // Vẽ các vạch chia độ (như trong ảnh)
                if (r % 2 === 0) {
                    ctx.save();
                    ctx.rotate(time * 0.01 * (r % 2 === 0 ? 1 : -1));
                    const ticks = 36;
                    for (let i = 0; i < ticks; i++) {
                        const tickAngle = (i / ticks) * Math.PI * 2;
                        const x1 = Math.cos(tickAngle) * (radius - 5);
                        const y1 = Math.sin(tickAngle) * (radius - 5);
                        const x2 = Math.cos(tickAngle) * (radius + 5);
                        const y2 = Math.sin(tickAngle) * (radius + 5);
                        
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(100, 200, 255, 0.1)`;
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            }
            ctx.restore();
        }

        // Bắt đầu
        window.addEventListener('resize', resize);
        resize();
        animate();

    </script>
</body>
</html>
