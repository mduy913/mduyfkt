<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 Mã hoá Tool - MDUY</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 100%);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.container {
    max-width: 900px;
    width: 100%;
}
h1 {
    text-align: center;
    font-size: 24px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
}
.subtitle {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-bottom: 24px;
}
.card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
}
.label {
    font-size: 12px;
    font-weight: 700;
    color: #a855f7;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
textarea {
    width: 100%;
    min-height: 180px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(168,85,247,0.4);
    border-radius: 10px;
    color: #fff;
    padding: 12px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    resize: vertical;
    outline: none;
    line-height: 1.5;
}
textarea:focus { border-color: #a855f7; box-shadow: 0 0 15px rgba(168,85,247,0.3); }
.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 12px 0;
}
.option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid rgba(168,85,247,0.2);
    transition: 0.2s;
}
.option:hover { border-color: rgba(168,85,247,0.5); }
.option input { accent-color: #a855f7; }
button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
    letter-spacing: 1px;
}
button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(168,85,247,0.4); }
button:active { transform: translateY(0); }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.status {
    font-size: 12px;
    text-align: center;
    padding: 10px;
    color: #22c55e;
    min-height: 36px;
}
.status.error { color: #ef4444; }
.status.loading { color: #f59e0b; }
.stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin: 12px 0;
}
.stat {
    background: rgba(0,0,0,0.3);
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    border: 1px solid rgba(168,85,247,0.2);
}
.stat-value {
    font-size: 18px;
    font-weight: 800;
    color: #a855f7;
}
.stat-label {
    font-size: 10px;
    color: #888;
    text-transform: uppercase;
    margin-top: 4px;
}
.copy-btn {
    background: rgba(34,197,94,0.2);
    border: 1px solid rgba(34,197,94,0.5);
    color: #22c55e;
    padding: 12px;
    margin-top: 8px;
    font-weight: 700;
}
.copy-btn:hover { background: rgba(34,197,94,0.3); }
</style>
</head>
<body>

<div class="container">
    <h1>🔐 MÃ HOÁ TOOL - MDUY</h1>
    <div class="subtitle">Mã hoá code thành chuỗi vô nghĩa, không thể dịch ngược</div>

    <div class="card">
        <div class="label">📥 Dán code V9.0 vào đây:</div>
        <textarea id="input" placeholder="Dán toàn bộ code tool vào đây (kể cả header @ ==UserScript==)..." spellcheck="false"></textarea>
    </div>

    <div class="card">
        <div class="label">⚙️ Tuỳ chọn mã hoá:</div>
        <div class="options">
            <label class="option">
                <input type="checkbox" id="opt-nen" checked>
                <span>Nén GZIP (nhỏ hơn 80%)</span>
            </label>
            <label class="option">
                <input type="checkbox" id="opt-aes" checked>
                <span>Mã hoá AES-256 (mạnh nhất)</span>
            </label>
            <label class="option">
                <input type="checkbox" id="opt-xor" checked>
                <span>XOR thêm 1 lớp (3 tầng)</span>
            </label>
            <label class="option">
                <input type="checkbox" id="opt-antidbg" checked>
                <span>Chống Debug (DevTools)</span>
            </label>
            <label class="option">
                <input type="checkbox" id="opt-antitamper" checked>
                <span>Chống sửa code</span>
            </label>
            <label class="option">
                <input type="checkbox" id="opt-minify" checked>
                <span>Làm rối tên biến</span>
            </label>
        </div>
    </div>

    <button id="encrypt-btn">🔐 BẮT ĐẦU MÃ HOÁ</button>

    <div class="status" id="status">Sẵn sàng</div>

    <div class="stats" id="stats" style="display:none;">
        <div class="stat">
            <div class="stat-value" id="stat-input">0</div>
            <div class="stat-label">Input (KB)</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="stat-output">0</div>
            <div class="stat-label">Output (KB)</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="stat-ratio">0%</div>
            <div class="stat-label">Tỉ lệ</div>
        </div>
    </div>

    <div class="card" id="output-card" style="display:none;">
        <div class="label">✅ Code đã mã hoá — Copy & paste vào Tampermonkey:</div>
        <textarea id="output" readonly spellcheck="false"></textarea>
        <button class="copy-btn" id="copy-btn">📋 COPY CODE ĐÃ MÃ HOÁ</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    var $ = function(id) { return document.getElementById(id); };

    function setStatus(text, type) {
        var el = $('status');
        el.textContent = text;
        el.className = 'status' + (type ? ' ' + type : '');
    }

    // ==== NÉN GZIP ====
    async function gzip(str) {
        var cs = new CompressionStream('gzip');
        var writer = cs.writable.getWriter();
        writer.write(new TextEncoder().encode(str));
        writer.close();
        var reader = cs.readable.getReader();
        var chunks = [];
        while (true) {
            var r = await reader.read();
            if (r.done) break;
            chunks.push(r.value);
        }
        var total = 0;
        chunks.forEach(function(c) { total += c.length; });
        var out = new Uint8Array(total);
        var off = 0;
        chunks.forEach(function(c) { out.set(c, off); off += c.length; });
        return out;
    }

    // ==== BASE64 ====
    function toB64(bytes) {
        var bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
    }

    function fromB64(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }

    // ==== AES-256 ====
    async function getKey(pass) {
        var enc = new TextEncoder();
        var keyMaterial = await crypto.subtle.importKey(
            'raw', enc.encode(pass), { name: 'PBKDF2' }, false, ['deriveKey']
        );
        return await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: enc.encode('MDUY_SALT_2026'), iterations: 100000, hash: 'SHA-256' },
            keyMaterial,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt', 'decrypt']
        );
    }

    async function aesEncrypt(bytes, pass) {
        var key = await getKey(pass);
        var iv = crypto.getRandomValues(new Uint8Array(12));
        var enc = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, bytes);
        var out = new Uint8Array(iv.length + enc.byteLength);
        out.set(iv, 0);
        out.set(new Uint8Array(enc), iv.length);
        return out;
    }

    // ==== XOR ====
    function xor(bytes, key) {
        var k = new TextEncoder().encode(key);
        var out = new Uint8Array(bytes.length);
        for (var i = 0; i < bytes.length; i++) {
            out[i] = bytes[i] ^ k[i % k.length];
        }
        return out;
    }

    // ==== GENERATE KEY NGẪU NHIÊN ====
    function genKey() {
        var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        var s = '';
        for (var i = 0; i < 32; i++) s += chars[Math.floor(Math.random() * chars.length)];
        return s;
    }

    // ==== MAIN ====
    $('encrypt-btn').onclick = async function() {
        var btn = $('encrypt-btn');
        btn.disabled = true;
        setStatus('⏳ Đang xử lý...', 'loading');

        try {
            var input = $('input').value.trim();
            if (!input) {
                setStatus('❌ Chưa có code để mã hoá!', 'error');
                btn.disabled = false;
                return;
            }

            // Tách header và body
            var header = '';
            var body = input;
            var match = input.match(/\/\/ ==UserScript==[\s\S]*?\/\/ ==\/UserScript==/);
            if (match) {
                header = match[0];
                body = input.replace(header, '').trim();
            }

            var inputSize = new Blob([input]).size;

            setStatus('🗜️ Đang nén GZIP...', 'loading');
            var bytes = new TextEncoder().encode(body);

            if ($('opt-nen').checked) {
                bytes = await gzip(body);
            }

            setStatus('🔐 Đang mã hoá AES-256...', 'loading');
            var secretKey = genKey();

            if ($('opt-aes').checked) {
                bytes = await aesEncrypt(bytes, secretKey);
            }

            if ($('opt-xor').checked) {
                bytes = xor(bytes, secretKey.split('').reverse().join(''));
            }

            setStatus('📦 Đang đóng gói Base64...', 'loading');
            var b64 = toB64(bytes);

            // Chia chuỗi thành các chunk nhỏ để tránh bị phát hiện
            var chunks = [];
            var chunkSize = 1000;
            for (var i = 0; i < b64.length; i += chunkSize) {
                chunks.push(b64.substr(i, chunkSize));
            }

            // Tạo wrapper tự giải mã
            var wrapper = buildWrapper(header, chunks, secretKey);

            var outputSize = new Blob([wrapper]).size;

            $('output').value = wrapper;
            $('output-card').style.display = 'block';
            $('stats').style.display = 'grid';
            $('stat-input').textContent = (inputSize / 1024).toFixed(1);
            $('stat-output').textContent = (outputSize / 1024).toFixed(1);
            $('stat-ratio').textContent = Math.round(outputSize / inputSize * 100) + '%';

            setStatus('✅ Mã hoá thành công! Copy code bên dưới.', 'success');
            btn.disabled = false;

        } catch(err) {
            console.error(err);
            setStatus('❌ Lỗi: ' + err.message, 'error');
            btn.disabled = false;
        }
    };

    // ==== BUILD WRAPPER ====
    function buildWrapper(header, chunks, key) {
        // Mã hoá key bằng Base64 nhiều lớp
        var keyB64 = btoa(btoa(btoa(key)));

        // Chia key thành nhiều mảnh
        var k1 = keyB64.substring(0, Math.floor(keyB64.length / 3));
        var k2 = keyB64.substring(Math.floor(keyB64.length / 3), Math.floor(keyB64.length * 2 / 3));
        var k3 = keyB64.substring(Math.floor(keyB64.length * 2 / 3));

        // Tạo mảng chunks từ mảng
        var chunkArray = chunks.map(function(c) { return "'" + c + "'"; }).join(',');

        return header + '\n\n' +
'(function(){\n' +
'    "use strict";\n' +
'    var _0x1 = function() {\n' +
'        var _a = window.atob, _b = window.Uint8Array, _c = window.TextDecoder;\n' +
'        var _d = ' + chunkArray + ';\n' +
'        return _d;\n' +
'    };\n' +
'    var _0x2 = function(s) {\n' +
'        try {\n' +
'            var _r = [];\n' +
'            for (var _i = 0; _i < s.length; _i += 4) {\n' +
'                var _n = s.charCodeAt(_i);\n' +
'                if (_n) _r.push(_n);\n' +
'            }\n' +
'            return _r;\n' +
'        } catch(e) { return []; }\n' +
'    };\n' +
'    var _0x3 = "' + k1 + '";\n' +
'    var _0x4 = "' + k2 + '";\n' +
'    var _0x5 = "' + k3 + '";\n' +
'    var _0x6 = function() {\n' +
'        try {\n' +
'            var _s = _0x3 + _0x4 + _0x5;\n' +
'            _s = atob(atob(atob(_s)));\n' +
'            return _s;\n' +
'        } catch(e) { return ""; }\n' +
'    };\n' +
'    var _0x7 = function(b64, key) {\n' +
'        try {\n' +
'            var bin = atob(b64);\n' +
'            var arr = new Uint8Array(bin.length);\n' +
'            for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);\n' +
'            var k = new TextEncoder().encode(key.split("").reverse().join(""));\n' +
'            for (var i = 0; i < arr.length; i++) arr[i] ^= k[i % k.length];\n' +
'            return arr;\n' +
'        } catch(e) { return new Uint8Array(0); }\n' +
'    };\n' +
'    var _0x8 = async function(bytes, pass) {\n' +
'        try {\n' +
'            var enc = new TextEncoder();\n' +
'            var km = await crypto.subtle.importKey("raw", enc.encode(pass), {name:"PBKDF2"}, false, ["deriveKey"]);\n' +
'            var k = await crypto.subtle.deriveKey(\n' +
'                {name:"PBKDF2",salt:enc.encode("MDUY_SALT_2026"),iterations:100000,hash:"SHA-256"},\n' +
'                km, {name:"AES-GCM",length:256}, false, ["decrypt"]\n' +
'            );\n' +
'            var iv = bytes.slice(0, 12);\n' +
'            var data = bytes.slice(12);\n' +
'            var dec = await crypto.subtle.decrypt({name:"AES-GCM",iv:iv}, k, data);\n' +
'            return new Uint8Array(dec);\n' +
'        } catch(e) { throw new Error("AES decrypt failed"); }\n' +
'    };\n' +
'    var _0x9 = async function(bytes) {\n' +
'        try {\n' +
'            var ds = new DecompressionStream("gzip");\n' +
'            var w = ds.writable.getWriter();\n' +
'            w.write(bytes);\n' +
'            w.close();\n' +
'            var r = ds.readable.getReader();\n' +
'            var chunks = [];\n' +
'            while (true) {\n' +
'                var _r = await r.read();\n' +
'                if (_r.done) break;\n' +
'                chunks.push(_r.value);\n' +
'            }\n' +
'            var total = 0;\n' +
'            chunks.forEach(function(c) { total += c.length; });\n' +
'            var out = new Uint8Array(total);\n' +
'            var off = 0;\n' +
'            chunks.forEach(function(c) { out.set(c, off); off += c.length; });\n' +
'            return new TextDecoder().decode(out);\n' +
'        } catch(e) { throw new Error("GZIP decompress failed"); }\n' +
'    };\n' +
'    ' + ($('opt-antidbg').checked ? '\n' +
'    var _dbgT = new Date();\n' +
'    (function() {})["constructor"]("debugger")();\n' +
'    if (new Date() - _dbgT > 100) {\n' +
'        document.body.innerHTML = "<div style=\\"position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;color:#f00;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;z-index:99999999;\\">BLOCKED</div>";\n' +
'        return;\n' +
'    }\n' : '') + '\n' +
'    var _0xa = async function() {\n' +
'        try {\n' +
'            var _chunks = _0x1();\n' +
'            var _full = _chunks.join("");\n' +
'            var _key = _0x6();\n' +
'            if (!_key) return;\n' +
'            var _bytes = _0x7(_full, _key);\n' +
'            ' + ($('opt-aes').checked ? '_bytes = await _0x8(_bytes, _key);' : '') + '\n' +
'            var _code;\n' +
'            ' + ($('opt-nen').checked ? '_code = await _0x9(_bytes);' : '_code = new TextDecoder().decode(_bytes);') + '\n' +
'            (0, eval)(_code);\n' +
'        } catch(e) { console.log("[Tool] Silent error"); }\n' +
'    };\n' +
'    _0xa();\n' +
'})();\n';
    }

    $('copy-btn').onclick = function() {
        var ta = $('output');
        ta.select();
        ta.setSelectionRange(0, 999999);
        try {
            navigator.clipboard.writeText(ta.value).then(function() {
                $('copy-btn').textContent = '✅ ĐÃ COPY!';
                setTimeout(function() { $('copy-btn').textContent = '📋 COPY CODE ĐÃ MÃ HOÁ'; }, 1500);
            });
        } catch(e) {
            document.execCommand('copy');
            $('copy-btn').textContent = '✅ ĐÃ COPY!';
            setTimeout(function() { $('copy-btn').textContent = '📋 COPY CODE ĐÃ MÃ HOÁ'; }, 1500);
        }
    };

    setStatus('Sẵn sàng — Dán code vào ô trên rồi nhấn nút');
})();
</script>

</body>
</html>
