<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu ứng trái tim phát sáng</title>
    <style>
        /* Reset CSS */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Nền đen giống ảnh */
        }

        /* Canvas chiếm toàn màn hình */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // Cấu hình
        let width, height;
        const NUM_PARTICLES = 250; // Số lượng hạt
        const LIGHT_PINK = '255, 182, 193'; // Màu hồng nhạt (dạng RGB string)
        const BLUE_GLOW = '100, 200, 255'; // Màu xanh sáng
        const WHITE = '255, 255, 255'; // Màu trắng

        // Mảng chứa các hạt
        let particles = [];

        // Hàm thay đổi kích thước canvas
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles(); // Khởi tạo lại hạt khi đổi kích thước màn hình
        }

        // Công thức toán học tạo hình trái tim
        function heartShape(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x, y };
        }

        // Tạo danh sách các điểm đích trên hình trái tim
        function generateHeartPoints(numPoints) {
            const points = [];
            const scale = Math.min(width, height) / 40; // Tự động scale theo màn hình
            
            for (let i = 0; i < numPoints; i++) {
                // Chia đều các điểm trên đường cong trái tim
                const t = (i / numPoints) * Math.PI * 2;
                const { x, y } = heartShape(t);
                
                // Tính toán tọa độ màn hình
                const screenX = width / 2 + x * scale;
                const screenY = height / 2 - y * scale; // Trừ đi vì trục y trong canvas hướng xuống
                points.push({ x: screenX, y: screenY });
            }
            return points;
        }

        // Lớp Particle (Hạt)
        class Particle {
            constructor(targetX, targetY) {
                this.targetX = targetX;
                this.targetY = targetY;
                
                // Bắt đầu từ vị trí ngẫu nhiên
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                
                this.size = Math.random() * 2 + 1.5; // Kích thước từ 1.5 đến 3.5
                this.baseColor = this.getRandomColor();
                this.alpha = Math.random() * 0.7 + 0.3; // Độ mờ từ 0.3 đến 1.0
                this.speed = Math.random() * 0.06 + 0.02; // Tốc độ bay
                
                this.arrived = false;
                this.wobblePhase = Math.random() * Math.PI * 2;
                this.wobbleAmt = Math.random() * 2 + 1; // Độ rung lắc
            }

            getRandomColor() {
                const rand = Math.random();
                if (rand < 0.33) return LIGHT_PINK;
                if (rand < 0.66) return BLUE_GLOW;
                return WHITE;
            }

            update() {
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;

                // Kiểm tra xem hạt đã đến đích chưa
                if (Math.abs(dx) < 2 && Math.abs(dy) < 2) {
                    this.arrived = true;
                    // Hiệu ứng rung lắc khi đã vào vị trí
                    this.wobblePhase += 0.05;
                    this.x = this.targetX + Math.sin(this.wobblePhase) * this.wobbleAmt;
                    this.y = this.targetY + Math.cos(this.wobblePhase) * this.wobbleAmt;
                } else {
                    // Di chuyển mượt mà về đích
                    this.x += dx * this.speed;
                    this.y += dy * this.speed;
                }
            }

            draw() {
                // 1. Vẽ hạt chính (Particle Body)
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.baseColor}, ${this.alpha})`;
                ctx.fill();

                // 2. Vẽ quầng sáng (Glow Effect) - giống đoạn code Pygame trong ảnh
                if (this.arrived) {
                    ctx.beginPath();
                    // Vẽ hình tròn lớn hơn với màu hồng nhạt và độ mờ thấp
                    const glowSize = this.size * 4;
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize);
                    
                    // Tâm sáng
                    gradient.addColorStop(0, `rgba(${LIGHT_PINK}, ${this.alpha * 0.4})`);
                    // Rìa mờ dần
                    gradient.addColorStop(1, `rgba(${LIGHT_PINK}, 0)`);
                    
                    ctx.fillStyle = gradient;
                    ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Khởi tạo các hạt
        function initParticles() {
            particles = [];
            const heartPoints = generateHeartPoints(NUM_PARTICLES);
            
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const target = heartPoints[i];
                particles.push(new Particle(target.x, target.y));
            }
        }

        // Vòng lặp Animation
        function animate() {
            // Xóa màn hình với màu đen mờ (tạo vệt mờ - trail effect)
            // Nếu muốn xóa hoàn toàn, dùng: ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
            ctx.fillRect(0, 0, width, height);

            // Cập nhật và vẽ từng hạt
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        // Bắt đầu
        window.addEventListener('resize', resize);
        resize(); // Khởi tạo kích thước ban đầu
        animate(); // Bắt đầu vòng lặp

    </script>
</body>
</html>
